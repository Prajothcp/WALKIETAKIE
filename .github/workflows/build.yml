name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Prebuild Native Android
        run: npx expo prebuild --platform android --clean
      - name: Add Background Service to Manifest
        run: |
          sed -i 's|</application>|<service android:name="com.asterinet.react.bgactions.RNBackgroundActionsTask" android:foregroundServiceType="microphone\|mediaPlayback" android:exported="false" /></application>|g' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
